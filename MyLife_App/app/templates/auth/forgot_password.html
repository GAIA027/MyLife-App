<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(localStorage.getItem('mylife-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}</script>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('theme', {
            dark: localStorage.getItem('mylife-theme') === 'dark',
            toggle() {
                this.dark = !this.dark;
                localStorage.setItem('mylife-theme', this.dark ? 'dark' : 'light');
                if (this.dark) { document.documentElement.setAttribute('data-theme', 'dark'); }
                else { document.documentElement.removeAttribute('data-theme'); }
            }
        });
    });
    </script>

    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/auth/forgot_password.css">
    <title>MyLife — Reset Password</title>
</head>
<body x-data>

<div class="fp-page">
    <div class="fp-card">

        <div class="brand">
            <div class="auth-brand-mark"><i data-lucide="sprout"></i></div>
            <span class="brand-name">MyLife</span>
        </div>

        <div class="fp-icon">
            <i data-lucide="key-round"></i>
        </div>

        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Enter your email or username and choose a new password.</p>

        {% if success %}
        <div class="alert-success" style="width:100%;margin-bottom:16px;">&#10003; {{ success }}</div>
        <a href="/auth/login" class="submit-btn" style="display:block;text-align:center;text-decoration:none;">Back to Sign In</a>
        {% else %}

        {% if error %}
        <div class="alert-error" style="width:100%;margin-bottom:16px;">&#9888; {{ error }}</div>
        {% endif %}

        <form action="/auth/forgot-password" method="post" class="fp-form"
              x-data="{ loading: false, showPw: false, showConfirm: false }"
              @submit="loading = true">

            <div class="field">
                <label>Email or Username</label>
                <input type="text" name="email_or_username" placeholder="Enter your email or username" required>
            </div>

            <div class="field">
                <label>New Password</label>
                <div class="pw-wrap">
                    <input :type="showPw ? 'text' : 'password'" name="new_password"
                           placeholder="At least 8 characters" required>
                    <button type="button" class="pw-eye" @click="showPw = !showPw" tabindex="-1">
                        <i :data-lucide="showPw ? 'eye-off' : 'eye'"></i>
                    </button>
                </div>
                <p class="field-hint">Min 8 chars, uppercase, lowercase, number, special char</p>
            </div>

            <div class="field">
                <label>Confirm New Password</label>
                <div class="pw-wrap">
                    <input :type="showConfirm ? 'text' : 'password'" name="confirm_password"
                           placeholder="Repeat new password" required>
                    <button type="button" class="pw-eye" @click="showConfirm = !showConfirm" tabindex="-1">
                        <i :data-lucide="showConfirm ? 'eye-off' : 'eye'"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn" :disabled="loading">
                <span x-show="!loading">Reset Password</span>
                <span x-show="loading" style="display:none;">Resetting…</span>
            </button>

        </form>

        {% endif %}

        <a href="/auth/login" class="back-link">← Back to Sign In</a>

    </div>
</div>

<script>
lucide.createIcons();
document.addEventListener('alpine:initialized', () => lucide.createIcons());
</script>
</body>
</html>
