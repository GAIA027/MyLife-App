<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to MyLife">

    <script>if(localStorage.getItem('mylife-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}</script>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('theme', {
            dark: localStorage.getItem('mylife-theme') === 'dark',
            toggle() {
                this.dark = !this.dark;
                localStorage.setItem('mylife-theme', this.dark ? 'dark' : 'light');
                if (this.dark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            }
        });
    });
    </script>

    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/auth/login.css">
    <title>MyLife — Sign In</title>
</head>

<body x-data>

  <div class="container">
    <div class="left">

      <div class="brand-logo">
        <div class="auth-brand-mark">
            <i data-lucide="sprout" style="width:20px;height:20px;color:#fff;"></i>
        </div>
        <span class="brand-name">MyLife</span>
      </div>

      <div class="theme-row">
        <span class="theme-label">Dark Mode</span>
        <button class="theme-toggle"
                :class="{ active: $store.theme.dark }"
                @click="$store.theme.toggle()"
                aria-label="Toggle dark mode">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </button>
      </div>

      <a href="/" class="back-home">← Back to Home</a>

      <h1 class="title">Welcome back</h1>
      <p class="subtitle">Enter your email and password to sign in</p>

      {% if error %}
      <div class="error-box">
        <span>&#9888;</span> {{ error }}
      </div>
      {% endif %}

      <p class="register_text">
        Don't have an account? <a href="/auth/signup">Sign up here</a>
      </p>

      <form action="/auth/login" method="post"
            x-data="{ loading: false }"
            @submit="loading = true">

        <div class="field">
          <input type="text" name="email_or_username" placeholder="Email or Username" required>
        </div>

        <div class="field">
          <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="submit-btn" :disabled="loading">
          <span x-show="!loading">Sign In</span>
          <span x-show="loading" style="display:none;">Signing in…</span>
        </button>

      </form>
    </div>

    <div class="right">
      <img src="/static/images/Login:signuppagephoto.webp" class="light-img" alt="">
      <img src="/static/images/Dark mode login:signup photo.webp" class="dark-img" alt="">
    </div>
  </div>

<script>lucide.createIcons();</script>
</body>
</html>
